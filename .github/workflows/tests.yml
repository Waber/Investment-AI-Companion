# Minimal CI for the SQLite pytest suite.
#
# One job. It installs requirements.txt and runs pytest with a coverage
# report for app, main, and scripts. It does not lint or start Postgres.
# Total coverage (statements plus branches) must stay at or above 80%.
# JUnit XML and the MIN_TESTS gate are not enabled.
name: Tests

on:
  pull_request:
  push:
    branches:
      - master

# Read-only checkout token. This workflow does not read repository credentials.
permissions:
  contents: read

# Pull requests share one group, so a newer commit cancels the older run.
# A push has no pull request number, so the group is the commit SHA and
# cancel-in-progress is false. A master push is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python 3.12, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Stops Python from writing .pyc files next to the source. No database
      # URL or provider keys are set. Settings in app/core/config.py already
      # have defaults, and tests use in-memory SQLite.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        # v7 is the newest major tag for actions/checkout (v7.0.1) and runs
        # on Node 24. v5 would also, and v4 is the one that warns about Node 20.
        # persist-credentials false: the default stores the checkout token in
        # .git/config so later steps can push. This job never pushes.
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse to run when .env is present
        # app/core/config.py loads .env when that file exists. CI must not.
        run: test ! -e .env

      - name: Set up Python 3.12
        # v7 is the newest major tag published for actions/setup-python
        # (release v7.0.0). The floating v7 tag tracks that major line.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies from requirements.txt
        # Nothing else is installed. pytest, pytest-asyncio, and pytest-cov
        # are already pinned in requirements.txt. An extra unpinned plugin
        # can upgrade pytest and break pytest-asyncio 0.21.1.
        run: python -m pip install -r requirements.txt

      - name: Check installed packages
        run: python -m pip check

      - name: Show pytest version
        run: python -m pytest --version

      - name: Run pytest
        # -q prints the pass/fail summary. -p no:cacheprovider skips
        # .pytest_cache. --cov-fail-under=80 fails the job when the TOTAL
        # (app, main, scripts; statements plus branches) drops below 80%.
        # JUnit XML and the test-count gate stay out. DeprecationWarning is
        # an error now that the deprecation cleanup is on master.
        run: >
          python -m pytest -q -p no:cacheprovider
          -W error::DeprecationWarning
          --cov=app --cov=main --cov=scripts
          --cov-branch --cov-report=term-missing
          --cov-fail-under=80
