# Minimal CI for the SQLite pytest suite.
#
# One job. It installs requirements-dev.lock with pip --require-hashes
# and runs pytest with a coverage report for app, main, and scripts.
# It does not lint or start Postgres. Every uses: action is pinned to
# a full commit SHA with a trailing version comment.
# Total coverage (statements plus branches) must stay at or above 80%.
# JUnit XML and the MIN_TESTS gate are not enabled.
name: Tests

on:
  pull_request:
  push:
    branches:
      - master

# Read-only checkout token. This workflow does not read repository credentials.
permissions:
  contents: read

# Pull requests share one group, so a newer commit cancels the older run.
# A push has no pull request number, so the group is the commit SHA and
# cancel-in-progress is false. A master push is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python 3.12, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Stops Python from writing .pyc files next to the source. No database
      # URL or provider keys are set. Settings in app/core/config.py already
      # have defaults, and tests use in-memory SQLite.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        # Pinned to the commit of the v7.0.1 tag (lightweight tag; the
        # GitHub git ref for refs/tags/v7.0.1 is this commit). v7.0.1 runs
        # on Node 24. persist-credentials false: the default stores the
        # checkout token in .git/config so later steps can push. This job
        # never pushes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to run when .env is present
        # app/core/config.py loads .env when that file exists. CI must not.
        run: test ! -e .env

      - name: Set up Python 3.12
        # Pinned to the commit of the v7.0.0 tag (lightweight tag; the
        # GitHub git ref for refs/tags/v7.0.0 is this commit).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies from the hashed dev lock
        # requirements-dev.lock is produced by pip-compile --generate-hashes.
        # --require-hashes refuses any dependency that is not pinned and
        # hashed, including transitive ones. The lock includes pytest,
        # pytest-asyncio, and pytest-cov.
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check installed packages
        run: python -m pip check

      - name: Show pytest version
        run: python -m pytest --version

      - name: Run pytest
        # -q prints the pass/fail summary. -p no:cacheprovider skips
        # .pytest_cache. --cov-fail-under=80 fails the job when the TOTAL
        # (app, main, scripts; statements plus branches) drops below 80%.
        # JUnit XML and the test-count gate stay out. DeprecationWarning is
        # an error now that the deprecation cleanup is on master.
        run: >
          python -m pytest -q -p no:cacheprovider
          -W error::DeprecationWarning
          --cov=app --cov=main --cov=scripts
          --cov-branch --cov-report=term-missing
          --cov-fail-under=80
