# CI for the pytest suite.
#
# Two jobs. Both install requirements-dev.lock with pip --require-hashes.
# The SQLite job runs the default suite. addopts deselects integration
# tests, and this job does not start Postgres. Its total coverage
# (statements plus branches) for app, main, and scripts must stay at or
# above 80%.
# The PostgreSQL job runs only `-m integration` against the pinned
# postgres:16.15 image. It has no coverage gate: the gate measures the
# SQLite suite. It does not set DATABASE_URL, so the application default
# stays distinct from TEST_POSTGRES_DSN. The database name
# investment_test satisfies the DSN allowlist, so the job does not set
# TEST_POSTGRES_ALLOW_REMOTE.
# Neither job lints. Every uses: action is pinned to a full commit SHA
# with a trailing version comment.
# JUnit XML and the MIN_TESTS gate are not enabled.
name: Tests

on:
  pull_request:
  push:
    branches:
      - master

# Read-only checkout token. This workflow does not read repository credentials.
permissions:
  contents: read

# Pull requests share one group, so a newer commit cancels the older run.
# A push has no pull request number, so the group is the commit SHA and
# cancel-in-progress is false. A master push is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (Python 3.12, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Stops Python from writing .pyc files next to the source. No database
      # URL or provider keys are set. Settings in app/core/config.py already
      # have defaults, and tests use in-memory SQLite.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        # Pinned to the commit of the v7.0.1 tag (lightweight tag; the
        # GitHub git ref for refs/tags/v7.0.1 is this commit). v7.0.1 runs
        # on Node 24. persist-credentials false: the default stores the
        # checkout token in .git/config so later steps can push. This job
        # never pushes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to run when .env is present
        # app/core/config.py loads .env when that file exists. CI must not.
        run: test ! -e .env

      - name: Set up Python 3.12
        # Pinned to the commit of the v7.0.0 tag (lightweight tag; the
        # GitHub git ref for refs/tags/v7.0.0 is this commit).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies from the hashed dev lock
        # requirements-dev.lock is produced by pip-compile --generate-hashes.
        # --require-hashes refuses any dependency that is not pinned and
        # hashed, including transitive ones. The lock includes pytest,
        # pytest-asyncio, and pytest-cov.
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check installed packages
        run: python -m pip check

      - name: Show pytest version
        run: python -m pytest --version

      - name: Run pytest
        # -q prints the pass/fail summary. -p no:cacheprovider skips
        # .pytest_cache. --cov-fail-under=80 fails the job when the TOTAL
        # (app, main, scripts; statements plus branches) drops below 80%.
        # JUnit XML and the test-count gate stay out. DeprecationWarning is
        # an error now that the deprecation cleanup is on master.
        run: >
          python -m pytest -q -p no:cacheprovider
          -W error::DeprecationWarning
          --cov=app --cov=main --cov=scripts
          --cov-branch --cov-report=term-missing
          --cov-fail-under=80

  pytest-postgres:
    name: pytest (Python 3.12, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # postgres:16.15 matches the manual Europe/Warsaw check. The
      # digest is the image a previous CI run pulled for the floating
      # postgres:16 tag. The job reaches the container at
      # 127.0.0.1:5432. investment_test contains "test" as its own
      # word, which the DSN allowlist requires.
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/investment_test
      # Fail the job if the DSN is missing. A local run without it skips.
      REQUIRE_POSTGRES: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to run when .env is present
        run: test ! -e .env

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies from the hashed dev lock
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check installed packages
        run: python -m pip check

      - name: Show pytest version
        run: python -m pytest --version

      - name: Show PostgreSQL server version
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(os.environ["TEST_POSTGRES_DSN"])
          try:
              cursor = connection.cursor()
              cursor.execute("SELECT version()")
              print(cursor.fetchone()[0])
          finally:
              connection.close()
          PY

      - name: Run PostgreSQL integration tests
        # -m integration replaces addopts "-m not integration".
        # No coverage flags: this job does not run the SQLite suite.
        # DeprecationWarning stays an error, matching the SQLite job.
        run: >
          python -m pytest -q -p no:cacheprovider
          -W error::DeprecationWarning
          -m integration
