# Tooling settings shared by Black, isort, and pytest.
# flake8 does not read this file; its settings live in .flake8.
#
# Line length is 79 so Black agrees with flake8's default. Black's own
# default is 88, which reformats files this repository already checked at 79.

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79
# app, main, and scripts are this repository's code. isort otherwise treats
# a name it cannot find as an installed package as third-party, which moves
# those imports into the wrong group.
known_first_party = ["app", "main", "scripts"]

[tool.pytest.ini_options]
# Versions stay in requirements.txt. Do not pin pytest or pytest-asyncio
# here: pytest-asyncio 0.21.1 does not run on pytest 8 or later.
# Do not set filterwarnings. Turning warnings into errors is a separate
# decision; CI can pass -W on the command line until that is settled.
testpaths = ["tests"]
# PostgreSQL checks are opt-in. The default SQLite run uses
# "-m not integration", so a test with this marker does not run and does
# not fail when no database was configured. Run them with:
#   pytest -m integration
# That command-line -m replaces the addopts expression above.
# A node id does not turn the marker off. This still deselects the test
# and exits 5 ("1 deselected") unless -m integration is also passed:
#   pytest -m integration tests/integration/test_postgres.py::test_name
# Any future CI -m expression replaces this addopts -m as well, so that
# expression must still contain "not integration". Otherwise the default
# job would collect the opt-in PostgreSQL tests.
markers = [
    "integration: opt-in tests that require an explicitly configured PostgreSQL database.",
]
# --strict-markers: an unregistered marker is a collection error.
# The suite already uses pytest-asyncio's registered "asyncio" marker and
# pytest's built-in parametrize. A typo of "integration" must not slip into
# the default run.
addopts = [
    "--strict-markers",
    "-m",
    "not integration",
]
